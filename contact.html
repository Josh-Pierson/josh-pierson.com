<!DOCTYPE html>
<html>

<head>
    <title>Contact — Josh Pierson</title>
    <!-- Fix (2026-08-14): this page was missing the viewport meta tag that index.html has.
         Without it, mobile browsers render at a fake ~980px desktop width instead of the
         real screen width, so the mobile media queries and the mobile header-reveal JS
         (both keyed off window.innerWidth <= 768) never activated. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noai, noimageai">

    <!-- General page description, used by search engines -->
    <meta name="description" content="Get in touch with photographer Josh Pierson.">

    <!-- Open Graph tags: control how this page looks when shared on social media (Facebook, iMessage, Slack, etc.) -->
    <meta property="og:title" content="Contact — Josh Pierson">
    <meta property="og:description" content="Get in touch with photographer Josh Pierson.">
    <meta property="og:image" content="images/gallery/photo-02.jpg">
    <meta property="og:url" content="https://josh-pierson.com/contact.html">
    <meta property="og:type" content="website">

    <!-- Twitter Card tag: makes shared links show a large preview image on Twitter/X -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon: browser tab icon and iOS home-screen bookmark icon, both generated from photo-02.jpg -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="contact-page">

<header id="site-header">

    <h1>
        <a href="index.html">Josh Pierson</a>
        <a href="contact.html" class="contact-link">Contact</a>
    </h1>

</header>


<main id="contact-page">

    <img src="images/contact.png" alt="Josh Pierson">

    <div class="contact-text">

        <p>
            <!-- text here -->
        </p>

        <!-- Netlify Forms contact form. data-netlify="true" + name="contact" tell Netlify
             to detect and process this form automatically at deploy time — no backend
             or JS submission code needed. netlify-honeypot adds a hidden spam-trap field
             (bots tend to fill in every field they see; real visitors never see "bot-field"
             since it's display:none, so if it's filled in Netlify silently discards the
             submission). action="/thank-you.html" sends visitors to our own custom
             success page instead of Netlify's default one. -->
        <form name="contact" method="POST" action="/thank-you.html" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">

            <!-- Required hidden field so Netlify's build-time form parser can match
                 submissions to this form by name. -->
            <input type="hidden" name="form-name" value="contact">

            <!-- Honeypot field: hidden from real visitors with display:none, but visible
                 to spam bots that don't render CSS. -->
            <p style="display:none;">
                <label>Don't fill this out: <input name="bot-field" /></label>
            </p>

            <p class="form-field">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="name" required>
            </p>

            <p class="form-field">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" required>
            </p>

            <p class="form-field">
                <label for="contact-reason">Reason</label>
                <select id="contact-reason" name="reason">
                    <option value="Booking inquiry">Booking inquiry</option>
                    <option value="Print purchase">Print purchase</option>
                    <option value="Collaboration">Collaboration</option>
                    <option value="Other">Other</option>
                </select>
            </p>

            <p class="form-field">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="5" required></textarea>
            </p>

            <p class="form-field">
                <button type="submit">Send</button>
            </p>

        </form>

        <!-- Social/contact icon row: mailto envelope icon next to the Instagram icon,
             replacing the old plain-text "Mail: ..." link above the form. -->
        <div class="social-icons">

            <a href="mailto:joshpiersonphoto@gmail.com" aria-label="Email">

                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" ry="2"
                          fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M4 6.5l8 6 8-6"
                          fill="none" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

            </a>

            <a href="https://www.instagram.com/_joshpierson/" target="_blank" aria-label="Instagram">

                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"
                          fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="4"
                            fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="17.5" cy="6.5" r="1"
                            fill="currentColor"/>
                </svg>

            </a>

        </div>

    </div>

</main>

<footer id="site-footer">
    <p>&copy; 2026 Josh Pierson. All rights reserved. No AI training or scraping permitted.</p>
</footer>

<script>
const header = document.getElementById("site-header");

let mobileHeaderTimer;

function showMobileHeader() {

    header.classList.add("visible");

    clearTimeout(mobileHeaderTimer);

    mobileHeaderTimer = setTimeout(() => {
        header.classList.remove("visible");
    }, 3000);

}


// DESKTOP HEADER
document.addEventListener("mousemove", (event) => {

    if (window.innerWidth > 768) {

        if (event.clientY < 50) {
            header.classList.add("visible");
        } else {
            header.classList.remove("visible");
        }

    }

});


// MOBILE HEADER
function handleMobileInteraction() {

    if (window.innerWidth <= 768) {
        showMobileHeader();
    }

}

document.addEventListener("touchstart", handleMobileInteraction);
document.addEventListener("touchmove", handleMobileInteraction);
document.addEventListener("scroll", handleMobileInteraction);
</script>


</body>

</html>
