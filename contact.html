<!DOCTYPE html>
<html>

<head>
    <title>Contact — Josh Pierson</title>
    <meta name="robots" content="noai, noimageai">

    <!-- General page description, used by search engines -->
    <meta name="description" content="Get in touch with photographer Josh Pierson.">

    <!-- Open Graph tags: control how this page looks when shared on social media (Facebook, iMessage, Slack, etc.) -->
    <meta property="og:title" content="Contact — Josh Pierson">
    <meta property="og:description" content="Get in touch with photographer Josh Pierson.">
    <meta property="og:image" content="images/gallery/photo-02.jpg">
    <meta property="og:url" content="https://josh-pierson.com/contact.html">
    <meta property="og:type" content="website">

    <!-- Twitter Card tag: makes shared links show a large preview image on Twitter/X -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon: browser tab icon and iOS home-screen bookmark icon, both generated from photo-02.jpg -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="contact-page">

<header id="site-header">

    <h1>
        <a href="index.html">Josh Pierson</a>
        <a href="contact.html" class="contact-link">Contact</a>
    </h1>

</header>


<main id="contact-page">

    <img src="images/contact.png" alt="Josh Pierson">

    <div class="contact-text">

        <p>
            <!-- text here -->
        </p>

        <p>
            <a href="mailto:joshpiersonphoto@gmail.com">
                Mail: joshpiersonphoto@gmail.com
            </a>
        </p>

        <a href="https://www.instagram.com/_joshpierson/" target="_blank" aria-label="Instagram">

            <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" ry="5"
                      fill="none" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="4"
                        fill="none" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="17.5" cy="6.5" r="1"
                        fill="currentColor"/>
            </svg>

        </a>

    </div>

</main>

<footer id="site-footer">
    <p>&copy; 2026 Josh Pierson. All rights reserved. No AI training or scraping permitted.</p>
</footer>

<script>
const header = document.getElementById("site-header");

let mobileHeaderTimer;

function showMobileHeader() {

    header.classList.add("visible");

    clearTimeout(mobileHeaderTimer);

    mobileHeaderTimer = setTimeout(() => {
        header.classList.remove("visible");
    }, 3000);

}


// DESKTOP HEADER
document.addEventListener("mousemove", (event) => {

    if (window.innerWidth > 768) {

        if (event.clientY < 50) {
            header.classList.add("visible");
        } else {
            header.classList.remove("visible");
        }

    }

});


// MOBILE HEADER
function handleMobileInteraction() {

    if (window.innerWidth <= 768) {
        showMobileHeader();
    }

}

document.addEventListener("touchstart", handleMobileInteraction);
document.addEventListener("touchmove", handleMobileInteraction);
document.addEventListener("scroll", handleMobileInteraction);
</script>


</body>

</html>
